# Uptime monitor and status page for Belau Link — https://status.belau.app
# Runs entirely on GitHub (Actions + Pages), so it keeps working when Cloudflare does not.
owner: Belau-App
repo: status

sites:
  - name: Project page (belau.app)
    url: https://belau.app
  - name: Demo app (demo.belau.app)
    url: https://demo.belau.app
  - name: Admin console demo (admin.belau.app)
    url: https://admin.belau.app
  - name: API (api.belau.app)
    url: https://api.belau.app/health
  - name: Warning mirror (alerts.belau.app)
    url: https://alerts.belau.app

status-website:
  cname: status.belau.app
  name: Belau Link status
  introTitle: "**Belau Link** service status"
  introMessage: Independent checks every five minutes from GitHub, outside the Cloudflare network that runs Belau Link. This is the demo stage; it is not an official government service.
  navbar:
    - title: Status
      href: /
    - title: Belau Link
      href: https://belau.app

workflowSchedule:
  uptime: "*/5 * * * *"
